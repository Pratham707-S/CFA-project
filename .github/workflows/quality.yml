name: Quality gates

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm run test:frontend
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cfa_test
          POSTGRES_PASSWORD: cfa_test_only
          POSTGRES_DB: cfa_prep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cfa_test -d cfa_prep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CFA_TEST_DATABASE_URL: postgresql://cfa_test:cfa_test_only@127.0.0.1:5432/cfa_prep_test
      DATABASE_URL: postgresql://cfa_test:cfa_test_only@127.0.0.1:5432/cfa_prep_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run prisma:validate
        working-directory: backend
      - run: npm run prisma:generate
        working-directory: backend
      - run: npx prisma migrate deploy --schema prisma/schema.prisma
        working-directory: backend
      - name: Exercise password hash migrations with existing users
        working-directory: backend
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: cfa_test
          PGPASSWORD: cfa_test_only
        run: |
          createdb cfa_password_migration_v1_test
          psql -v ON_ERROR_STOP=1 -d cfa_password_migration_v1_test -f prisma/migrations/20261118173238_init/migration.sql
          psql -v ON_ERROR_STOP=1 -d cfa_password_migration_v1_test -c "INSERT INTO \"User\" (id, email, \"updatedAt\") VALUES ('legacy-user', 'legacy@example.test', CURRENT_TIMESTAMP)"
          if psql -v ON_ERROR_STOP=1 -d cfa_password_migration_v1_test -f prisma/migrations/20261118173932_add_user_password_hash/migration.sql > /tmp/password-migration-v1.log 2>&1; then
            echo "Expected passwordHash migration to reject a pre-existing user without a hash." >&2
            exit 1
          fi
          grep -F "contains null values" /tmp/password-migration-v1.log
          createdb cfa_password_migration_v2_test
          psql -v ON_ERROR_STOP=1 -d cfa_password_migration_v2_test -f prisma/migrations/20261118173238_init/migration.sql
          psql -v ON_ERROR_STOP=1 -d cfa_password_migration_v2_test -c "ALTER TABLE \"User\" ADD COLUMN \"passwordHash\" TEXT; INSERT INTO \"User\" (id, email, \"updatedAt\") VALUES ('legacy-user', 'legacy@example.test', CURRENT_TIMESTAMP)"
          if psql -v ON_ERROR_STOP=1 -d cfa_password_migration_v2_test -f prisma/migrations/20261118231200_add_user_password_hash/migration.sql > /tmp/password-migration-v2.log 2>&1; then
            echo "Expected duplicate passwordHash migration to reject a legacy null hash." >&2
            exit 1
          fi
          grep -F "contains null values" /tmp/password-migration-v2.log
      - run: npm run typecheck
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run test:coverage
        working-directory: backend
      - run: npm run seed
        working-directory: backend
        env:
          DATABASE_URL: ""
          CFA_SEED_TARGET: local
          CFA_SEED_DATABASE_URL: postgresql://cfa_test:cfa_test_only@127.0.0.1:5432/cfa_prep_test
          CFA_SEED_CONFIRM_NONPRODUCTION: I_VERIFIED_THIS_IS_NOT_PRODUCTION
      - run: npm run test:integration
        working-directory: backend
      - run: npm run seed:verify-idempotency
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: backend
